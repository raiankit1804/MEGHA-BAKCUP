version: "3.9"

services:
  # ─── Databases ──────────────────────────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    container_name: weathergpt_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-weathergpt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weathergpt_secret}
      POSTGRES_DB: ${POSTGRES_DB:-weathergpt}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-weathergpt}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    container_name: weathergpt_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-weathergpt}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-weathergpt_secret}
      MONGO_INITDB_DATABASE: weathergpt
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: weathergpt_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-weathergpt_secret} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-weathergpt_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend ─────────────────────────────────────────────────────────────────

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: weathergpt_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-weathergpt}:${POSTGRES_PASSWORD:-weathergpt_secret}@postgres:5432/${POSTGRES_DB:-weathergpt}
      MONGODB_URL: mongodb://${MONGO_USER:-weathergpt}:${MONGO_PASSWORD:-weathergpt_secret}@mongo:27017/weathergpt?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:-weathergpt_secret}@redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─── Frontend ────────────────────────────────────────────────────────────────

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: weathergpt_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  mongo_data:
  redis_data:
